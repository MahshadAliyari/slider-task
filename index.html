<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="اسلایدر تصویری-slider" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Slider | اسلایدر تصویری محصول</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="Slider">
      <h1>محصولات پیشنهادی</h1>
      <p>محبوب‌ترین محصولات دیجیتال را مشاهده کنید</p>
      <div class="slider-container">
        <button id="prevBtn" type="button">❮</button>
        <img
          id="sliderImage"
          src="images/iphone.png"
          alt="image 1 of Slider"
        />
        <button id="nextBtn" type="button">❯</button>
      </div>
      <div class="slider-dots" id="sliderDots"></div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
